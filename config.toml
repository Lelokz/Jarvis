# Jarvis — configuração
#
# Tudo que dá pra ajustar sem mexer em código está aqui.
# O ESCOPO §3 exige que a persona fique fora do código, porque a ideia é
# trocar por uma personagem feminina no futuro.

[persona]
nome = "Jarvis"

# O que ele fala ao acordar. Curto: é confirmação de que ouviu, não conversa.
saudacao = "Pois não?"
# "Dorme aí".
indo_dormir = "Tá bom."
# "Para" no meio de uma tarefa do Claude.
parei = "Parei."

# O Claude fora do ar. O resto da fala é do próprio Claude (out/2026): ele
# fala do jeito dele, sem frase pronta.
limite_acabou = "Meu limite do Claude acabou. Volta {hora}, daqui a {falta}."
limite_acabou_sem_hora = "Meu limite do Claude acabou. Ainda não sei quando volta."
sem_internet = "Tô sem internet. Pausar, voltar e o volume ainda funcionam; o resto espera a internet voltar."
cerebro_falhou = "Não consegui falar com o Claude agora. Tenta de novo?"

# WhatsApp que chega (o aviso é do corpo do Jarvis, sem o Claude).
whats_chegou = "{nome} mandou: {texto}"
whats_chegou_sem_texto = "Mensagem de {nome} no WhatsApp."
whats_varias = "{nome} mandou {n} mensagens. A última: {texto}"
whats_oferta = "Quer responder?"

[friday]
# A segunda persona (25/10/2026): "Hey Friday" chama ela, "hey Jarvis" chama
# ele. As duas dividem a conversa, a memória e as regras; muda o jeito, a voz
# e a cor. Personalidade em jarvis/agente/personalidade_friday.md.
ligada = true
# Modelo pronto da comunidade (fwartner/home-assistant-wakewords-collection).
# Medido: 5/5 com a voz do Léo (notas 0,82–0,87), zero alarme falso em 2,2 h
# de anime e nunca dispara com "hey Jarvis".
modelo_wake = "hey_friday_comunidade"
limiar = 0.50
# A voz da Emilia (servidor_friday.py, na venv da voz).
socket = "jarvis-friday.sock"
cor = "#ff6fb5"

[persona_friday]
nome = "Friday"
saudacao = "Oi, chefinho!"
indo_dormir = "Tá bom!"
parei = "Parei!"
limite_acabou = "Ai, meu limite do Claude acabou. Volta {hora}, daqui a {falta}."
limite_acabou_sem_hora = "Ai, meu limite do Claude acabou. Ainda não sei quando volta."
sem_internet = "Tô sem internet! Pausar, voltar e o volume ainda funcionam; o resto espera a internet voltar."
cerebro_falhou = "Ai, não consegui falar com o Claude agora. Tenta de novo?"
whats_chegou = "{nome} mandou: {texto}"
whats_chegou_sem_texto = "Mensagem de {nome} no WhatsApp!"
whats_varias = "{nome} mandou {n} mensagens! A última: {texto}"
whats_oferta = "Quer responder?"

[midia]
# mpv toca só o áudio (sem janela); o navegador entra quando você diz
# "no YouTube". Medido: o yt-dlp do apt resolve a busca mas falha ao extrair
# formatos — por isso o da venv, que é o novo, vem primeiro no caminho.
comando_mpv = "mpv"
comando_ytdlp = ".venv/bin/yt-dlp"
comando_navegador = "xdg-open"
segundos_busca = 20

# De quanto em quanto o volume sobe e desce quando você não diz um número.
passo_volume = 10

# Acima deste valor, mudar o volume pede confirmação falada — nos dois
# caminhos, relativo e absoluto. De 65 pedindo para aumentar, confirma antes de
# ir a 75. "Coloca no 100", confirma.
#
# O número é o do Léo, não um redondo qualquer: ele usa o volume entre 50 e 60
# no dia a dia, e ACIMA DE 70 JÁ DÓI O OUVIDO. O motivo de isto existir é um
# "pode dar play agora" que o modelo leu como volume 100 — e doeu de verdade.
limite_confirmacao = 70

# Quanto esperar o som SAIR DE VERDADE antes de dizer "tocando".
#
# O mpv entra no barramento em 0,45s já declarando PlaybackStatus=Playing, e a
# posição só começa a andar por volta de 6s — ou seja, ele mente por ~6
# segundos. Medido. Passando a URL de áudio direta, isso cai para ~1s, mas o
# teto fica folgado porque rede ruim existe. Estourou o teto: ele diz que não
# conseguiu, em vez de anunciar som que não saiu.
segundos_para_o_som = 12

[audio]
# "" usa o microfone padrão do sistema. Para fixar outro, use um trecho do
# nome — `python etapa0.py --listar-dispositivos` mostra a lista.
# Nesta máquina existem 3 entradas: Fifine MV-SILICON (padrão), Fifine K420
# e o headset H510-PRO.
dispositivo_entrada = ""
dispositivo_saida = ""
taxa_amostragem = 16000

# Portão anti-eco: quanto esperar depois que o Jarvis termina de falar antes
# de reabrir o microfone. Sem isto ele pega a cauda da própria voz nas caixas
# e responde a si mesmo em laço. Suba se estiver usando caixas num ambiente
# com eco; pode baixar bastante se usar o headset.
guarda_pos_fala_ms = 300

[vad]
# Probabilidade mínima do Silero para considerar que há fala.
# Subir = menos ruído captado, mais risco de cortar fala baixa.
limiar = 0.5

# Quantos blocos de 32ms seguidos acima do limiar para abrir o segmento.
# 2 blocos ≈ 64ms: evita que um estalo ou uma batida de mesa abra gravação.
blocos_para_iniciar = 2

# Quanto silêncio encerra o segmento. ESTE É O MAIOR PEDAÇO DA LATÊNCIA
# PERCEBIDA — é o primeiro botão a girar se a resposta parecer lenta.
# Baixar demais faz ele cortar você no meio de uma pausa natural.
# 26/10/2026: era 700 e cortava o Léo no meio da frase (27 de 83 falas do dia
# vieram em pedaços). 1300 = ~0,6 s a mais de espera, sem cortar ele.
silencio_final_ms = 1300

# Áudio guardado ANTES do VAD disparar. O detector só reage depois que a fala
# já começou; sem isto a primeira sílaba some e o Whisper recebe "estando o
# jarvis" em vez de "testando o jarvis".
pre_roll_ms = 300

# Segmento mais curto que isto é descartado sem chegar ao Whisper.
# É a defesa contra o "comando fantasma" do ESCOPO §7.
fala_minima_ms = 250

# Trava de segurança: encerra o segmento à força.
fala_maxima_s = 20.0

[stt]
modelo = "large-v3-turbo"
dispositivo = "cuda"

# Pedido explícito do Léo: int8.
# Em Ampere (que é o caso da 3060), "int8_float16" costuma ser mais rápido.
# Como esta etapa é um banco de medição, vale rodar as duas e comparar os
# .jsonl em logs/ — é trocar só esta palavra.
compute_type = "int8"

# Idioma fixo: pula a etapa de detecção automática e economiza tempo.
idioma = "pt"

# Quantos caminhos o Whisper considera. 1 = busca gulosa = menor latência,
# que foi a escolha da Etapa 0 quando latência era a pergunta em aberto.
# Medido na Etapa 1 — ver medicoes/etapa1-stt.md.
beam_size = 1

# Alimenta o initial_prompt do Whisper com os nomes do atalhos.toml antes de
# transcrever. Fala rápida é onde ele mais depende de contexto, e "loft" não é
# palavra em português: sem vocabulário ele tende a inventar algo parecido.
# A lista sai do atalhos.toml, então nome novo lá já melhora a transcrição.
usar_vocabulario = true

[tts]
# "rvc" = a voz do JARVIS dublado, 2ª versão (20/10/2026, aprovada pelo Léo):
# a Kokoro fala e o servidor_rvc.py troca o timbre pelo do JARVIS; sem o
# servidor, fala com a Kokoro abaixo.
# "f5" = a 1ª versão (servidor_voz.py): o "s" estourava e abafava.
# "kokoro" = a Kokoro sozinha; "piper" = a voz de antes.
motor = "rvc"

# Kokoro: pm_alex (escolhida), pm_santa; pf_dora para a futura personagem.
# Piper: pt_BR-faber-medium, pt_BR-cadu-medium, pt_BR-jeff-medium.
voz = "pm_alex"

# Maior = mais devagar. 0.87 = 1,15x mais rápido (out/2026, pedido do Léo:
# "1,15 é mais bonitinha"; antes era 0.769 = 1,3x).
velocidade = 0.87

# Só Kokoro (e a reserva do "rvc"). "suave" = só corpo nos graves (out/2026: o Léo achou a voz
# robotizada); "jarvis" = eco curto de capacete + graves; "" = puro.
efeito = "suave"
# Semitons; negativo = mais grave. O Léo ouviu -4, -3, -2 e -1 (graves
# demais) e 0; ficou com meio semitom abaixo.
tom = -0.5
# Só "f5": onde o servidor_voz.py atende (em $XDG_RUNTIME_DIR).
socket_f5 = "jarvis-voz.sock"
# Só "rvc": onde o servidor_rvc.py atende (em $XDG_RUNTIME_DIR).
socket_rvc = "jarvis-rvc.sock"

[wakeword]
# Escolhido e medido na Etapa 0.5: 20/20 de acerto na pronúncia inglesa
# ("hey Jarvis", não "Járvis"), zero falso positivo em 10 minutos.
modelo = "hey_jarvis_v0.1"

# 0.50 está num platô — de 0.45 a 0.50 o resultado é idêntico. Há 0.05 de
# folga para baixo antes que mexer aqui mude qualquer comportamento.
limiar = 0.50

# Abaixo do limiar, mas alto o bastante para valer gravar o áudio. É o que
# permite auditar um quase-acerto depois: o log diz o score, o .wav diz o que
# o microfone ouviu.
piso_registro = 0.10

# Um "hey Jarvis" pontua alto por vários frames seguidos. Sem isto, uma fala
# viraria vários acordares.
refratario_s = 1.5

[ciclo]
# Quanto tempo ele fica escutando depois de acordar (ESCOPO §4).
# O relógio reinicia quando ELE termina de responder, não quando você para
# de falar.
janela_s = 30.0

[log]
# Grava um .wav por segmento aprovado pelo VAD, em logs/audio/, com o mesmo
# timestamp da linha do .jsonl. Serve para separar erro de microfone de erro
# de modelo quando uma transcrição sair errada.
#
# Atenção: num assistente ligado o dia todo isto grava toda frase que você
# falar dentro da janela — bem mais áudio do que era num teste de laboratório.
salvar_audio = true

# Teto de arquivos em logs/audio-wake/. Ao passar do limite, o mais antigo é
# apagado. Processo que fica ligado o dia todo não pode crescer sem limite.
max_audios_wake = 200

[ponte]
# O canal entre o assistente e os outros clientes — a interface da Etapa 6, e o
# celular depois. Um socket unix: sem porta, sem firewall, e só o próprio
# usuário entra.
#
# Desligar aqui não muda nada no assistente de voz; ele funciona igual sem
# cliente nenhum conectado. E se a ponte não abrir, ele avisa e sobe sem ela.
ligada = true

# Vazio = $XDG_RUNTIME_DIR/jarvis.sock (/run/user/1000/jarvis.sock).
socket = ""

# Eventos esperando por cliente antes de a ponte desistir dele. O nível do
# microfone sai primeiro quando enche; se encher mesmo assim, o cliente não
# está lendo e é desligado — para ele nunca segurar o laço de áudio.
fila_max = 256

[remoto]
# A porta do celular (out/2026): o porta_remota.py traduz entre o app (ou a
# página de teste) e a ponte acima. Escuta SÓ em 127.0.0.1; quem a leva para
# o celular é o `tailscale serve`, com HTTPS e só para os aparelhos do Léo. E
# além disso o aparelho tem que apresentar a chave.
ligada = true
porta = 8765
# Criada na primeira vez (0600). `porta_remota.py --endereco` mostra o link.
chave = "~/.local/share/jarvis/remoto-chave"

[whatsapp]
# O Jarvis avisa as mensagens que chegam, e o Claude manda o que você ditar
# (sem "pode": pedir já é a confirmação). Precisa da ponte whatsapp-mcp
# rodando (ver ESCOPO).
ativo = true
# O banco de mensagens da ponte. Fora do git: são as suas conversas.
banco = "~/.local/share/jarvis/whatsapp-mcp/whatsapp-bridge/store/messages.db"
# Só o próprio PC (a ponte foi alterada para não ouvir a rede).
api = "http://127.0.0.1:8080/api/send"
# Grupo vira barulho o dia todo: desligado. Conversa individual sempre avisa.
avisar_grupos = false
# true: "Fulano mandou: tu vem jantar?". false: só "Mensagem de Fulano." (tem
# gente na casa).
ler_conteudo = true
# De quanto em quanto tempo olha se chegou mensagem.
intervalo_s = 3

[agente]
# O cérebro (out/2026, decisão do Léo): o Claude Code INTEIRO, pelo Agent SDK
# e com o login da assinatura. Mesmas ferramentas do VS Code (Bash, arquivos,
# Playwright, Gmail, Agenda, Drive...), sem roteador nem lista de funções.
binario = "~/.local/bin/claude"
modelo = "claude-opus-5-5"
# O que atende primeiro (21/10/2026, ideia do Léo: escolher conforme o
# pedido). Medido: o Haiku responde em ~1,3 s o que o Opus leva ~2,1 s, e
# tarefa com ferramenta em ~3 s contra ~6 s; o esforço quase não mudava nada.
# Pedido que é trabalho de verdade, o próprio Haiku passa para o `modelo`
# (ferramenta chamar_o_opus). Vazio = só o `modelo`, como antes.
modelo_rapido = "claude-haiku-5-5"
# "medium" (20/10/2026, pedido do Léo: "ele não precisa de tudo isso"); antes
# era "high".
effort = "medium"
# "auto": o próprio Claude julga o que roda direto (como no VS Code do Léo).
# O que ele achar sério vira pergunta FALADA, nunca pop-up.
modo_permissao = "auto"
# A pasta de trabalho dele: memória e anotações do Léo. FORA do git.
casa = "~/.local/share/jarvis/casa"
# Uma pergunta dele (permissão, dúvida) só aceita resposta que COMECE até
# tantos segundos depois de ele terminar de perguntar. Passou, vale "não":
# um "pode" de um vídeo minutos depois não aprova nada.
validade_pergunta_s = 10.0

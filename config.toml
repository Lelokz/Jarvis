# Jarvis — configuração
#
# Tudo que dá pra ajustar sem mexer em código está aqui.
# O ESCOPO §3 exige que a persona fique fora do código, porque a ideia é
# trocar por uma personagem feminina no futuro.

[persona]
nome = "Jarvis"

# O que ele fala ao acordar. Curto: é confirmação de que ouviu, não conversa.
saudacao = "Pois não?"

# Quando entendeu a frase mas não é nada que ele saiba fazer ainda.
nao_sei = "Isso eu ainda não sei fazer."

# Quando o modelo devolve um nome que não bate com o que você falou. Precisa
# ser diferente do nao_sei, senão não dá para distinguir os dois no teste.
nao_entendi = "Não entendi o nome, repete?"

# Quando você nega uma confirmação sem dizer o que queria.
o_que_entao = "O que você quis dizer?"

# Quando você diz "pode" ou "não" e não há nada esperando confirmação.
# Precisa ser diferente do nao_sei: cair no nao_sei fez o Léo sair de uma
# conversa acreditando ter marcado um dentista que nunca existiu.
nada_pendente = "Não tem nada esperando confirmação."

# Quando a pista que você deu para estreitar uma busca não casa com nenhum
# candidato. Os candidatos continuam guardados — é só tentar outra pista.
pista_ruim = "Com essa pista não achei nada. Tenta outra?"

# --- frases da desambiguação -------------------------------------------
# Estas carregam a EXPLICAÇÃO de propósito. A versão anterior era só
# "Achei três. Em qual pasta?" — e o Léo entendeu como "qual pasta você quer
# de dentro daí", quando a pergunta era "em qual desses lugares está o que
# você quer". Ele respondeu errado em todos os testes por causa disso.
#
# A frase precisa dizer três coisas: que são o MESMO NOME, que estão em
# LUGARES DIFERENTES, e que a resposta esperada é o LUGAR.
#
# Campos disponíveis: {n} = quantos, {lugares} = a lista falada,
# {termo} = o que você pediu.
busca_poucos = "Achei {n} com esse nome, em lugares diferentes: {lugares}. Em qual deles?"
busca_muitos = "Achei {n} coisas com esse nome espalhadas pelo disco. Me diz o nome de uma pasta do caminho pra estreitar."
busca_muitos_ainda = "Ainda são {n} com esse nome. Me diz outra pasta do caminho pra estreitar."
busca_nada = "Não achei nada chamado {termo}."

# Mídia (Etapa 3).
qual_musica = "Qual música?"
musica_nao_achei = "Não achei nada no YouTube com {termo}."

# Achou o vídeo, mandou tocar, e o som não saiu no tempo. Precisa ser diferente
# de "Tocando": dizer que está tocando quando não está foi exatamente o bug —
# o Léo esperou, não veio som, e não tinha como saber se era ele ou o Jarvis.
musica_nao_saiu = "Achei {titulo}, mas o som não saiu."

# Volume acima do limite. Diz o número ANTES de mexer no som — é a única
# chance de barrar um valor que o modelo entendeu errado antes de ele chegar
# no seu ouvido.
volume_confirmar = "Volume em {novo}. Pode?"
volume_cancelado = "Beleza, deixa como está."
volume_descartado = "Deixei o volume como estava."

# Agenda (Etapa 4). A confirmação diz o DIA DA SEMANA de propósito: é assim que
# você percebe que ele entendeu sábado quando você quis dizer segunda. Erro de
# data é silencioso — um ISO bem formado e errado parece certo.
agenda_confirmar = "{titulo} {quando}. Pode?"
agenda_criado = "Marquei."
agenda_cancelado = "Beleza, deixa pra lá."

# Você tinha um evento esperando confirmação e falou de outra coisa. Ele
# descarta e faz o que você pediu agora — mas diz o que caiu, com as mesmas
# palavras que você tinha acabado de ouvir. Sumir calado é o que faz você
# achar que marcou.
agenda_descartado = "Descartei {titulo} {quando}."
agenda_sem_quando = "Para quando?"

# Ele disse o dia mas não a hora do dia. Perguntar é melhor que marcar num
# horário que você não falou: "marca dentista amanhã" criava às 9h e
# confirmava "dentista amanhã, sexta", sem hora — palpite invisível.
# Período JÁ conta como hora dita: "amanhã de manhã" não cai aqui.
agenda_sem_hora = "Que horas?"

# Dia sem nenhum compromisso, do começo ao fim.
agenda_vazia = "Você não tem nada {dia}."

# Hoje tinha compromisso, mas todos já aconteceram. Precisa ser diferente do
# agenda_vazia: "você não tem nada hoje" às 22h seria mentira sobre o dia, e
# ler de volta o que já passou seria pior ainda.
agenda_acabou = "Por hoje acabou, não tem mais nada."

# Os três casos de lista. A separação existe porque a frase tem que dizer a
# verdade sobre o que ela está fazendo: só o terceiro caso está resumindo, e
# só ele anuncia o resumo. A versão anterior dizia "Os próximos:" sempre, e
# num dia de 5 compromissos isso lia 3 sem avisar que havia mais.
# {n} = quantos existem, {mostrados} = quantos ele vai falar.
agenda_um = "Você tem um {dia}: {eventos}."
agenda_varios = "Você tem {n} {dia}: {eventos}."
agenda_muitos = "Você tem {n} {dia}. Os próximos {mostrados}: {eventos}."

# Arquivos (Etapa 5). A confirmação diz os DOIS nomes, o atual e o novo, porque
# é a única chance de você perceber que ele pegou o arquivo errado — a busca
# pode ter achado um só e você nunca ouviu qual era.
arquivo_confirmar = "Renomeio {atual} para {novo}. Pode?"
arquivo_cancelado = "Beleza, deixa pra lá."

# Ele entendeu qual arquivo mas não o nome novo. Medido: em 3 de 5 rodadas de
# "muda o nome do print" o modelo devolve 'print' — o nome do próprio alvo —
# com ancoragem 1.00, que a guarda não tem como barrar. Perguntar é a saída.
arquivo_qual_nome = "Para o quê?"

# Ele entendeu que era para renomear mas não qual arquivo ("renomeia esse aí").
arquivo_qual = "Qual arquivo?"

# Achou o arquivo, mas ele está fora do onde_pode_mexer. Precisa ser diferente
# do busca_nada: dizer "não achei" seria mentira, e você ficaria repetindo o
# nome achando que o Whisper errou.
arquivo_fora_da_lista = "Achei, mas não está numa pasta que você liberou pra eu mexer."

# Criar pasta sem dizer onde, ou dizendo um lugar que não é pasta conhecida.
# Não guarda estado: é operação inofensiva, e pedir a frase inteira de novo
# custa menos que mais um estado pendente no núcleo.
arquivo_onde_criar = "Dentro de qual pasta? Fala o comando inteiro."

# Você tinha uma renomeação esperando "pode" e falou de outra coisa. Mesmo
# motivo da agenda_descartado: sumir calado faz você achar que renomeou.
arquivo_descartado = "Descartei a renomeação de {atual}."

# "desfaz" sem nada para desfazer.
nada_para_desfazer = "Não tem nada para desfazer."

[arquivos]
# As ÚNICAS pastas onde ele pode criar pasta ou renomear arquivo. Fora daqui
# ele recusa e diz.
#
# Isto é o atalhos.toml desta etapa. A busca da Etapa 2 varre a home e o HD
# inteiros, e está certa em fazer isso: ela existe para ACHAR, e achar em todo
# lugar é o certo. AGIR em todo lugar não é. A lista converte "pode mexer em
# qualquer coisa da home" em "pode mexer numa lista que é sua".
#
# Caminho que só chegue aqui por symlink ou por ".." é recusado: a checagem
# resolve o caminho antes de comparar.
onde_pode_mexer = [
    "~/Downloads",
    "~/Documentos",
    "~/Área de trabalho",
]

[llm]
url = "http://localhost:11434"
modelo = "qwen3:8b"

# Quanto tempo o Ollama segura o modelo na VRAM depois do último comando.
# "5m" é o padrão dele, e o meio-termo escolhido na Etapa 1: o Whisper já fica
# residente (~1,1GB) e o qwen3:8b pesa ~6GB — segurar os dois o tempo todo
# tiraria dos jogos a VRAM que o ESCOPO §4 queria proteger.
# Medido: comando com o modelo quente ~0,5s; primeiro comando depois de
# descarregado ~6s. Use "-1" para deixar residente, "0" para descarregar já.
keep_alive = "5m"
timeout_s = 120

# Guarda contra o modelo inventar: o nome que ele devolve tem que ser
# encontrável na transcrição. Com a lista de atalhos no prompt, ele às vezes
# força uma entrada embaralhada para dentro da lista — "abridança.ppxt" já
# virou "loft" e abriu o navegador, com nota 1.00 e sem confirmação.
# Medido: normalizações legítimas ficam acima de 0.737, invenções abaixo de
# 0.333. O corte de 0.60 tem folga dos dois lados.
ancoragem_minima = 0.60

[midia]
# mpv toca só o áudio (sem janela); o navegador entra quando você diz
# "no YouTube". Medido: o yt-dlp do apt resolve a busca mas falha ao extrair
# formatos — por isso o da venv, que é o novo, vem primeiro no caminho.
comando_mpv = "mpv"
comando_ytdlp = ".venv/bin/yt-dlp"
comando_navegador = "xdg-open"
segundos_busca = 20

# De quanto em quanto o volume sobe e desce quando você não diz um número.
passo_volume = 10

# Acima deste valor, mudar o volume pede confirmação falada — nos dois
# caminhos, relativo e absoluto. De 65 pedindo para aumentar, confirma antes de
# ir a 75. "Coloca no 100", confirma.
#
# O número é o do Léo, não um redondo qualquer: ele usa o volume entre 50 e 60
# no dia a dia, e ACIMA DE 70 JÁ DÓI O OUVIDO. O motivo de isto existir é um
# "pode dar play agora" que o modelo leu como volume 100 — e doeu de verdade.
limite_confirmacao = 70

# Quanto esperar o som SAIR DE VERDADE antes de dizer "tocando".
#
# O mpv entra no barramento em 0,45s já declarando PlaybackStatus=Playing, e a
# posição só começa a andar por volta de 6s — ou seja, ele mente por ~6
# segundos. Medido. Passando a URL de áudio direta, isso cai para ~1s, mas o
# teto fica folgado porque rede ruim existe. Estourou o teto: ele diz que não
# conseguiu, em vez de anunciar som que não saiu.
segundos_para_o_som = 12

[acoes]
# Os executáveis de cada tipo do atalhos.toml. Ficam aqui para você trocar sem
# mexer em código. O modelo NUNCA escreve nada disto: ele só devolve um nome,
# que vira chave de busca na tabela.
# Nesta máquina o xdg-open já abre no Brave, que é o navegador padrão.
comando_site = "xdg-open"
comando_pasta = "xdg-open"
comando_vscode = "code"

[audio]
# "" usa o microfone padrão do sistema. Para fixar outro, use um trecho do
# nome — `python etapa0.py --listar-dispositivos` mostra a lista.
# Nesta máquina existem 3 entradas: Fifine MV-SILICON (padrão), Fifine K420
# e o headset H510-PRO.
dispositivo_entrada = ""
dispositivo_saida = ""
taxa_amostragem = 16000

# Portão anti-eco: quanto esperar depois que o Jarvis termina de falar antes
# de reabrir o microfone. Sem isto ele pega a cauda da própria voz nas caixas
# e responde a si mesmo em laço. Suba se estiver usando caixas num ambiente
# com eco; pode baixar bastante se usar o headset.
guarda_pos_fala_ms = 300

[vad]
# Probabilidade mínima do Silero para considerar que há fala.
# Subir = menos ruído captado, mais risco de cortar fala baixa.
limiar = 0.5

# Quantos blocos de 32ms seguidos acima do limiar para abrir o segmento.
# 2 blocos ≈ 64ms: evita que um estalo ou uma batida de mesa abra gravação.
blocos_para_iniciar = 2

# Quanto silêncio encerra o segmento. ESTE É O MAIOR PEDAÇO DA LATÊNCIA
# PERCEBIDA — é o primeiro botão a girar se a resposta parecer lenta.
# Baixar demais faz ele cortar você no meio de uma pausa natural.
silencio_final_ms = 700

# Áudio guardado ANTES do VAD disparar. O detector só reage depois que a fala
# já começou; sem isto a primeira sílaba some e o Whisper recebe "estando o
# jarvis" em vez de "testando o jarvis".
pre_roll_ms = 300

# Segmento mais curto que isto é descartado sem chegar ao Whisper.
# É a defesa contra o "comando fantasma" do ESCOPO §7.
fala_minima_ms = 250

# Trava de segurança: encerra o segmento à força.
fala_maxima_s = 20.0

[stt]
modelo = "large-v3-turbo"
dispositivo = "cuda"

# Pedido explícito do Léo: int8.
# Em Ampere (que é o caso da 3060), "int8_float16" costuma ser mais rápido.
# Como esta etapa é um banco de medição, vale rodar as duas e comparar os
# .jsonl em logs/ — é trocar só esta palavra.
compute_type = "int8"

# Idioma fixo: pula a etapa de detecção automática e economiza tempo.
idioma = "pt"

# Quantos caminhos o Whisper considera. 1 = busca gulosa = menor latência,
# que foi a escolha da Etapa 0 quando latência era a pergunta em aberto.
# Medido na Etapa 1 — ver medicoes/etapa1-stt.md.
beam_size = 1

# Alimenta o initial_prompt do Whisper com os nomes do atalhos.toml antes de
# transcrever. Fala rápida é onde ele mais depende de contexto, e "loft" não é
# palavra em português: sem vocabulário ele tende a inventar algo parecido.
# A lista sai da tabela, então atalho novo já melhora a transcrição dele.
usar_vocabulario = true

[tts]
motor = "piper"

# Vozes masculinas PT-BR baixadas: faber, cadu e jeff (todas "medium").
# Trocar aqui e rodar de novo é o jeito de comparar as três.
voz = "pt_BR-faber-medium"

# Maior = mais devagar (é o length_scale do Piper).
velocidade = 1.0

[wakeword]
# Escolhido e medido na Etapa 0.5: 20/20 de acerto na pronúncia inglesa
# ("hey Jarvis", não "Járvis"), zero falso positivo em 10 minutos.
modelo = "hey_jarvis_v0.1"

# 0.50 está num platô — de 0.45 a 0.50 o resultado é idêntico. Há 0.05 de
# folga para baixo antes que mexer aqui mude qualquer comportamento.
limiar = 0.50

# Abaixo do limiar, mas alto o bastante para valer gravar o áudio. É o que
# permite auditar um quase-acerto depois: o log diz o score, o .wav diz o que
# o microfone ouviu.
piso_registro = 0.10

# Um "hey Jarvis" pontua alto por vários frames seguidos. Sem isto, uma fala
# viraria vários acordares.
refratario_s = 1.5

[ciclo]
# Quanto tempo ele fica escutando depois de acordar (ESCOPO §4).
# O relógio reinicia quando ELE termina de responder, não quando você para
# de falar.
janela_s = 30.0

[agenda]
# Fuso dos eventos criados. O calendário do Léo também tem um; este é o que
# vai no corpo do evento.
fuso = "America/Sao_Paulo"

# Quanto dura um evento quando você não diz. "Marca dentista amanhã às 9" não
# tem fim — uma hora é o padrão que menos surpreende.
duracao_padrao_min = 60

# Quantos compromissos ele lê em voz alta. Acima disso, diz o total e lê só os
# primeiros — mesmo motivo dos 95 resultados da Etapa 2: lista longa falada é
# pior que nenhuma.
max_eventos_falados = 3

[busca]
# Onde procurar. Raiz inexistente é pulada em silêncio — o HD externo só entra
# quando estiver montado, e não ter ele ligado não é erro.
# TEMPORÁRIO: o HD monta com o UUID como nome. O Léo vai trocar para
# /mnt/hd — quando trocar, atualizar aqui e no atalhos.toml.
raizes = ["~", "/mnt/cab1286d-6765-4c73-9c77-8d3119b4b644"]

# O que nunca entra no resultado. Isto é o que torna a busca usável: sem as
# exclusões, procurar "config" devolvia 6382 resultados, 617 deles dentro
# destas pastas.
ignorar = [
    "node_modules",
    ".venv",
    ".cache",
    ".git",
    "site-packages",
    "__pycache__",
    ".local/share/Trash",
    # Medido numa busca real por "downloads", que devolvia 95 resultados:
    # .icons sozinho removia 84 deles (downloads.svg de tema de ícone), e o
    # resto era Steam e prefixo Wine. Com tudo isto, 95 viraram 2 — que eram
    # as duas pastas Downloads de verdade.
    ".icons",
    "icons",
    ".steam",
    "steamapps",
    "compatdata",
    "pfx",
]

# Teto do que fica guardado para você estreitar. Um termo genérico pode deixar
# centenas mesmo depois de filtrado; não vale carregar todas.
max_resultados = 200

# Trava do fallback com `find`. O plocate é instantâneo, mas o índice dele é
# atualizado uma vez por dia — arquivo baixado agora só apareceria amanhã.
# Quando ele não acha nada, varremos as raízes de verdade, com este limite
# para a conversa não travar.
segundos_find = 8

[log]
# Grava um .wav por segmento aprovado pelo VAD, em logs/audio/, com o mesmo
# timestamp da linha do .jsonl. Serve para separar erro de microfone de erro
# de modelo quando uma transcrição sair errada.
#
# Atenção: num assistente ligado o dia todo isto grava toda frase que você
# falar dentro da janela — bem mais áudio do que era num teste de laboratório.
salvar_audio = true

# Teto de arquivos em logs/audio-wake/. Ao passar do limite, o mais antigo é
# apagado. Processo que fica ligado o dia todo não pode crescer sem limite.
max_audios_wake = 200
